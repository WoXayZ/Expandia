# Expandia mod metadata. Placeholders are injected from gradle.properties at build time.
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "${mod_issue_tracker}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "${mod_url}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Terralith / biome mods are optional: Expandia never touches biome selection,
# it only modifies the land-mask density function, so it stays compatible.
[[dependencies.${mod_id}]]
modId = "terralith"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
