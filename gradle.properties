# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Environment versions
# Minecraft 26.1.2 uses the new calendar versioning and ships unobfuscated.
minecraft_version=26.1.2
minecraft_version_range=[26.1.2,26.2)
# NeoForge 26.1.2.75 -> build 75 for Minecraft 26.1.2 (year.release.patch.build).
neoforge_version=26.1.2.75
neoforge_version_range=[26.1.2.75,)
# javafml loader version range.
loader_version_range=[5,)

# Mod metadata
mod_id=expandia
mod_name=Expandia
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.expandia
mod_authors=Expandia Team
mod_description=Progression based world generation. Players start on a tiny island and unlock more of the world through advancements.

# CurseForge / publishing
mod_url=https://www.curseforge.com/minecraft/mc-mods/expandia
mod_issue_tracker=https://github.com/expandia/expandia/issues
